apiVersion: v1
kind: Namespace
metadata:
  name: my-app
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 192.168.56.1:5001/travel-guide-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5003  

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: my-app
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - port: 5003 
    targetPort: 5003