apiVersion: v1
kind: Namespace
metadata:
  name: my-website
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: my-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/2urbinator2/microservice-testapp/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: my-website
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 3001          
    targetPort: 3001  