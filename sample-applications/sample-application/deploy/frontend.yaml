apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: my-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/2urbinator2/microservice-testapp/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80 

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: my-website
spec:
  selector:
    app: frontend
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80          
    targetPort: 80  