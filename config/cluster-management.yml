- name: Configure kubectl for central cluster management
  hosts: "cluster-control-1"
  become: yes
  tasks:
    - name: Take IP address of enp0s10
      ansible.builtin.command: ip -4 addr show enp0s10
      register: enp0s10_ip_raw

    - name: Extract the IP address
      ansible.builtin.set_fact:
        advertise_ip: "{{ (enp0s10_ip_raw.stdout | regex_search('inet ([0-9.]+)/', '\\1')) | first }}"

    - name: Write config.yaml with dynamic advertise-address
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: |
          advertise-address: {{ advertise_ip }}
          tls-san:
            - {{ advertise_ip }}
        owner: root
        group: root
        mode: '0644'
    
    - name: Restart k3s to apply new configuration
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: Copy k3s.yaml from host to local machine
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ lookup('env','HOME') }}/.kube/cs-cluster/my-cluster.yml"
        flat: yes

    - name: Update server address in kubeconfig
      ansible.builtin.replace:
        path: "{{ lookup('env','HOME') }}/.kube/cs-cluster/my-cluster.yml"
        regexp: 'server: https://127\.0\.0\.1:6443'
        replace: "server: https://{{ advertise_ip }}:6443"
      delegate_to: localhost
      run_once: true
      become: no

    - name: Ensure kubeconfig has context "my-cluster"
      ansible.builtin.command:
        cmd: kubectl --kubeconfig "{{ lookup('env','HOME') }}/.kube/cs-cluster/my-cluster.yml" config set-context my-cluster --cluster=my-cluster --user=my-cluster
      delegate_to: localhost
      run_once: true
      become: no
    
    - name: Set server address in my-cluster.yml
      ansible.builtin.replace:
        path: "{{ lookup('env','HOME') }}/.kube/cs-cluster/my-cluster.yml"
        regexp: 'server: https://.*:6443'
        replace: 'server: https://{{ advertise_ip }}:6443'
      delegate_to: localhost
      run_once: true
      become: no
