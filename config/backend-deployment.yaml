apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/2urbinator2/backend:1.0
        ports:
        - containerPort: 5000
      imagePullSecrets:
      - name: ghcr-secret