<!DOCTYPE html>
<html>
<head>
  <title>Quote App</title>
</head>
<body>
  <h1>Wixxer</h1>
  <div id="quote"></div>

  <script>
    async function loadQuote() {
      const res = await fetch("http://localhost:5000/quote");
      const data = await res.json();
      document.getElementById("quote").innerText = data.quote;
    }
    loadQuote();
  </script>
</body>
</html>
