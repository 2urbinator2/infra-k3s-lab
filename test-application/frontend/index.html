<!DOCTYPE html>

<html>
  <head>
    <title>Travel Guide</title>
  </head>

  <body>
    <h1>Berlin Travel Guide</h1>
    
    <div id="quote"></div>

    <script>
      async function loadQuote() {
        try {
          const res = await fetch("http://localhost:31000/quote");
          const data = await res.json();
          document.getElementById("quote").innerHTML = 'I would recommend visiting <span style="color:red;">'+data.quote+'</span> first.';
        } catch (err) {
          document.getElementById("quote").innerText = "Error loading the quote";
          console.error(err);
        }
      }
      loadQuote();
    </script>

  </body>
</html>
