[cluster-control]
cluster-control ansible_port={{ lookup('env','CLUSTER_CONTROL_PORT') }} ansible_ssh_private_key_file=.vagrant/machines/cluster-control/virtualbox/private_key 

[cluster-worker]
cluster-worker ansible_port={{ lookup('env','CLUSTER_WORKER_PORT') }} ansible_ssh_private_key_file=.vagrant/machines/cluster-worker/virtualbox/private_key 

[all:vars]
ansible_host=127.0.0.1
ansible_user=vagrant 
ansible_python_interpreter=/usr/bin/python3

