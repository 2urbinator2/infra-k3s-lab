[control]
cluster-control-1 ansible_port={{ lookup('env','CONTROL_PORT') }} ansible_ssh_private_key_file=.vagrant/machines/cluster-control/virtualbox/private_key 

[worker]
cluster-worker-1 ansible_port={{ lookup('env','WORKER_PORT') }} ansible_ssh_private_key_file=.vagrant/machines/cluster-worker/virtualbox/private_key 

[all:vars]
ansible_host=127.0.0.1
ansible_user=vagrant 
ansible_python_interpreter=/usr/bin/python3

